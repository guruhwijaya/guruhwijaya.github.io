function exp(){var b=new Blob([build()],{type:'text/html'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='index.html';document.body.appendChild(a);a.click();a.remove();try{localStorage.removeItem('wifi_nj_dirty')}catch(e){}render()}
function due(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,11)}
function isLate(k){return now>=due(k)}
function cust(id){return S.cust.filter(function(x){return x.id===id})[0]}
function pay(id,k){return S.pay[id+'|'+(k||cur)]}
function paid(p){return p&&p.m!=='g'&&p.m!=='-'}
function arrears(c){var n=0,keys=[],y=+S.start.split('-')[0],m=+S.start.split('-')[1],k;for(;;){k=y+'-'+pad(m);if(k>now.getFullYear()+'-'+pad(now.getMonth()+1))break;if(isLate(k)&&!paid(pay(c.id,k)))keys.push(k);m++;if(m>12){m=1;y++}}return keys}
function colr(a){var s=(a.b||'').toLowerCase();return s.indexOf('bca')>-1?'#1228d8':s.indexOf('bri')>-1?'#2f6fd6':s.indexOf('sea')>-1?'#f59300':s.indexOf('shopee')>-1?'#ee4d2d':'#7c4dff'}
function accTxt(){return S.acc.map(function(a){return '• '+a.b+' '+a.n+(a.o?' a.n. '+a.o:'')}).join('\n')}
function msg(c){var ar=arrears(c),tot=(ar.length||1)*c.fee;return 'Halo '+c.name+', mengingatkan tagihan WiFi North Joenstone '+(ar.length>1?'('+ar.length+' bulan: '+ar.map(ml).join(', ')+')':ml(cur))+' sebesar '+rp(ar.length>1?tot:c.fee)+'. Pembayaran paling lambat tgl 10.\n\nTransfer ke:\n'+accTxt()+'\n\nTerima kasih 🙏'}
function wa(c){var p=(c.phone||'').replace(/\D/g,'');if(p[0]==='0')p='62'+p.slice(1);return 'https://wa.me/'+p+'?text='+encodeURIComponent(msg(c))}
function copy(t,b){var ok=false;try{var x=document.createElement('textarea');x.value=t;x.style.position='fixed';x.style.opacity=0;document.body.appendChild(x);x.select();ok=document.execCommand('copy');x.remove()}catch(e){}if(!ok){try{navigator.clipboard.writeText(t);ok=true}catch(e){}}if(b){var o=b.textContent;b.textContent=ok?'Tersalin ✓':'Gagal';setTimeout(function(){b.textContent=o},1400)}}
function rowsHtml(){var HD=!EDIT&&S.hide,o='',q=Q.trim().toUpperCase();S.cust.forEach(function(c,i){if(q&&c.name.indexOf(q)<0)return;var p=pay(c.id),m=p?p.m:'-',late=!paid(p)&&m!=='g'&&isLate(cur),ar=arrears(c);
var tx=paid(p)?(HD?'✓ LUNAS':rp(p.a))+(p.d?' · Tgl '+fd(p.d):''):m==='g'?'TIDAK BAYAR':late?'⚠ TELAT':'BELUM BAYAR';
o+='<div class="row"><div class="no">'+(i+1)+'</div>'+nm(c,ar)+'<button class="st'+(late?' late':'')+'" style="background:'+M[m][1]+'" data-a="'+(EDIT?'st':'hist')+'" data-i="'+c.id+'">'+tx+(paid(p)?'<small>'+M[m][0]+'</small>':'')+'</button></div>'});return o||'<p style="color:var(--mu);text-align:center">Nama tidak ditemukan</p>'}
function hist(id){var c=cust(id),HD=!EDIT&&S.hide,y=+(S.start||'2026-09').split('-')[0],m=+(S.start||'2026-09').split('-')[1],cn=now.getFullYear()+'-'+pad(now.getMonth()+1),r=[],h='';
for(;;){var k=y+'-'+pad(m);if(k>cn)break;r.unshift(k);m++;if(m>12){m=1;y++}}
r.forEach(function(k){var p=pay(c.id,k),mm=p?p.m:'-',late=!paid(p)&&mm!=='g'&&isLate(k);h+='<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)"><span>'+ml(k)+'</span><span style="background:'+M[mm][1]+';color:#fff;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700">'+(paid(p)?(HD?'✓ LUNAS':rp(p.a))+(p.d?' · '+fd(p.d):'')+' · '+M[mm][0]:mm==='g'?'TIDAK BAYAR':late?'⚠ TELAT':'BELUM BAYAR')+'</span></div>'});
sheet('<h3>'+esc(c.name)+'</h3><p style="color:var(--mu);font-size:13px;margin:2px 0 6px">Riwayat pembayaran</p>'+h+'<div class="btns"><button data-a="cl">Tutup</button></div>')}
function accSheet(){sheet('<h3>Rekening pembayaran</h3><p style="color:var(--mu);font-size:13px;margin:2px 0 8px">Bayar paling lambat tgl 10</p>'+S.acc.map(function(a,i){return '<div class="acc" style="--c:'+colr(a)+'"><div><small>Via '+esc(a.b)+(a.o?' · '+esc(a.o):'')+'</small><b>'+esc(a.n)+'</b></div><button class="sm" data-a="cp" data-i="'+i+'">Salin</button></div>'}).join('')+'<div class="btns"><button data-a="cl">Tutup</button></div>')}
document.addEventListener('input',function(e){if(e.target.id==='q'){Q=e.target.value;$('rows').innerHTML=rowsHtml()}});
function render(){
var HD=!EDIT&&S.hide;if(!EDIT&&tab==='p')tab='t';if(HD&&tab==='r')tab='t';badge();$('bn').innerHTML=EDIT&&dirty()?'<div class="card" style="border-color:#f59300"><b>Ada perubahan belum dibagikan</b><p style="margin:4px 0 8px;color:var(--mu);font-size:13px">Pelanggan masih melihat versi lama. Ekspor, lalu unggah ulang file ke hosting.</p><button class="btn pri" data-a="exp" style="border:0;margin:0">Ekspor versi lihat</button></div>':'';$('mt').textContent=ml(cur);var tot=0,np=0,tg=0;S.cust.forEach(function(c){var p=pay(c.id);tg+=c.fee;if(paid(p)){np++;tot+=p.a||0}});
$('pb').style.width=(tg?Math.min(100,tot/tg*100):0)+'%';
$('sm').innerHTML=HD?'<span><b>'+np+' / '+S.cust.length+'</b>sudah bayar</span><span style="text-align:right"><b>'+(S.cust.length-np)+'</b>belum bayar</span>':'<span><b>'+rp(tot)+'</b>terkumpul</span><span><b>'+np+' / '+S.cust.length+'</b>sudah bayar</span><span style="text-align:right"><b>'+rp(Math.max(0,tg-tot))+'</b>sisa target</span>';
$('tabs').innerHTML=[['t','Tagihan']].concat(HD?[]:[['r','Rekap']]).concat(EDIT?[['p','Pengaturan']]:[]).map(function(x){return '<button data-a="tab" data-v="'+x[0]+'" class="'+(tab===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('');
var h='';
if(tab==='t'){h+='<input id="q" style="margin-bottom:10px" placeholder="🔍 Cari nama pelanggan" value="'+esc(Q)+'"><div id="rows">'+rowsHtml()+'</div>';
if(EDIT)h+='<button class="btn" data-a="new">+ TAMBAH PELANGGAN</button><button class="btn pri" data-a="bill" style="border:0">Salin pesan tagihan (yang belum bayar)</button>';
h+='<div class="leg">'+Object.keys(M).map(function(k){return '<span style="background:'+M[k][1]+'">'+M[k][0]+'</span>'}).join('')+'</div><div class="warn">PEMBAYARAN PALING LAMBAT TGL 10</div>';
h+=S.acc.map(function(a,i){return '<div class="acc" style="--c:'+colr(a)+'"><div><small>Via '+esc(a.b)+(a.o?' · '+esc(a.o):'')+'</small><b>'+esc(a.n)+'</b></div><button class="sm" data-a="cp" data-i="'+i+'">Salin</button></div>'}).join('')}
if(tab==='r'){var by={},cnt={};S.cust.forEach(function(c){var p=pay(c.id);if(paid(p)){by[p.m]=(by[p.m]||0)+(p.a||0);cnt[p.m]=(cnt[p.m]||0)+1}});
h+='<div class="card"><h4 style="margin-top:0">Pemasukan per metode · '+ml(cur)+'</h4>';
var mx=Math.max.apply(null,Object.keys(by).map(function(k){return by[k]}).concat([1]));
Object.keys(M).filter(function(k){return k!=='g'&&k!=='-'}).forEach(function(k){h+='<div class="rk"><div><span>'+M[k][0]+' ('+(cnt[k]||0)+')</span><b>'+rp(by[k])+'</b></div><div class="bar"><i style="width:'+((by[k]||0)/mx*100)+'%;background:'+M[k][1]+'"></i></div></div>'});
h+='</div><div class="card"><h4 style="margin-top:0">Tunggakan</h4>';var any=false;S.cust.forEach(function(c){var a=arrears(c);if(a.length){any=true;h+='<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)"><b>'+esc(c.name)+'</b><span style="color:#e00000">'+a.length+' bln · '+rp(a.length*c.fee)+'</span></div>'}});if(!any)h+='<span style="color:var(--mu)">Tidak ada tunggakan 🎉</span>';h+='</div>'}
if(tab==='p'){h+=syncCard();h+='<div class="card"><label style="display:flex;gap:10px;align-items:center;margin:0;color:var(--tx)"><input type="checkbox" id="hide" style="width:auto"'+(S.hide?' checked':'')+'>Sembunyikan nominal &amp; tunggakan dari pelanggan</label></div>';h+='<div class="card"><h4 style="margin-top:0">Bagikan ke pelanggan</h4><p style="color:var(--mu);font-size:13px;margin:0 0 8px">1. Ketuk Ekspor, file index.html terunduh.<br>2. Unggah file itu ke hosting, link tetap sama.<br>3. Bagikan link ke pelanggan (hanya lihat).</p><button class="btn pri" data-a="exp" style="border:0">Ekspor versi lihat</button><button class="btn" data-a="out">Keluar mode edit</button></div><div class="card"><h4 style="margin-top:0">Rekening pembayaran</h4>'+S.acc.map(function(a,i){return '<div class="acc" style="--c:'+colr(a)+'"><div><small>'+esc(a.b)+(a.o?' · '+esc(a.o):'')+'</small><b style="font-size:15px">'+esc(a.n)+'</b></div><button class="sm" data-a="ea" data-i="'+i+'">Edit</button></div>'}).join('')+'<button class="btn" data-a="na">+ Tambah rekening</button></div>';
h+='<div class="card"><h4 style="margin-top:0">Tarif default pelanggan baru</h4><input id="fee" type="number" inputmode="numeric" value="'+S.fee+'"></div><div class="card"><h4 style="margin-top:0">Awalan IP jaringan</h4><p style="color:var(--mu);font-size:13px;margin:0 0 8px">Dipakai bila IP pelanggan hanya ditulis angka terakhirnya. Tautan IP hanya berfungsi saat HP tersambung ke WiFi yang sama.</p><input id="ipb" value="'+esc(S.ipBase)+'"></div>';
h+='<div class="card"><h4 style="margin-top:0">Backup &amp; Restore</h4><p style="color:var(--mu);font-size:13px;margin:0 0 8px">Salin data, simpan di catatan/WhatsApp. Untuk memulihkan, tempel di kolom bawah.</p><button class="btn pri" data-a="bk" style="border:0">Salin data backup</button><textarea id="rs" rows="3" placeholder="Tempel data backup di sini"></textarea><button class="btn" data-a="rest" style="margin-top:8px">Pulihkan dari data tempelan</button></div>'}
$('main').innerHTML=h}
function chips(){return Object.keys(M).map(function(k){return '<button data-a="chip" data-m="'+k+'" style="background:'+M[k][1]+'" class="'+(k===sel?'on':'')+'">'+M[k][0]+'</button>'}).join('')}
function sheet(h){$('sh').innerHTML=h;$('ov').style.display='flex'}
function closeS(){$('ov').style.display='none'}
function openC(id){edit=id;var c=id?cust(id):{name:'',fee:S.fee,phone:''},p=id?pay(id):null;sel=p?p.m:'-';
var dv=p&&p.d?p.d:now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
var h='<h3>'+(id?esc(c.name):'Pelanggan baru')+'</h3><label>Nama</label><input id="fn" value="'+esc(c.name)+'" style="text-transform:uppercase"><label>No. WhatsApp</label><input id="fp" inputmode="tel" value="'+esc(c.phone)+'" placeholder="08xxxxxxxxxx"><label>IP / alamat (angka terakhir saja juga boleh)</label><input id="fi" value="'+esc(c.ip||'')+'" placeholder="192.168.87.125 atau 125"><label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="fr" style="width:auto"'+(c.rnd?' checked':'')+'>IP acak (berubah-ubah)</label><label>Tarif per bulan (Rp)</label><input id="ff" type="number" inputmode="numeric" value="'+c.fee+'">';
if(id)h+='<button class="btn pri" data-a="quick" style="border:0;margin:12px 0 0">✓ Lunas hari ini ('+M[S.lm||'t'][0]+')</button><label>Pembayaran '+ml(cur)+'</label><div class="chips">'+chips()+'</div><label>Tanggal bayar</label><input type="date" id="fdt" value="'+dv+'"><label>Nominal (Rp)</label><input type="number" id="fa" inputmode="numeric" value="'+(p&&p.a?p.a:c.fee)+'">';
h+='<div class="btns">'+(id?'<button class="del" data-a="dc">Hapus</button><a class="wa" target="_blank" rel="noopener" href="'+wa(c)+'">WhatsApp</a>':'')+'<button data-a="cl">Batal</button><button class="pri" data-a="sv">Simpan</button></div>';sheet(h)}
function openA(i){edit=i;var a=i==null?{b:'',n:'',o:''}:S.acc[i];sheet('<h3>'+(i==null?'Rekening baru':'Edit rekening')+'</h3><label>Bank / platform</label><input id="ab" value="'+esc(a.b)+'" placeholder="BCA, BRI, SeaBank, Shopee..."><label>Nomor</label><input id="an" value="'+esc(a.n)+'"><label>Atas nama (opsional)</label><input id="ao" value="'+esc(a.o)+'"><div class="btns">'+(i==null?'':'<button class="del" data-a="da">Hapus</button>')+'<button data-a="cl">Batal</button><button class="pri" data-a="sa">Simpan</button></div>')}
document.addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(!t){if(e.target.id==='ov')closeS();return}var a=t.dataset.a;if(!EDIT&&a!=='mv'&&a!=='tab'&&a!=='cp'&&a!=='hist'&&a!=='acc')return;
if(a==='mv'){var p=cur.split('-'),d=new Date(+p[0],+p[1]-1+ +t.dataset.n,1);cur=d.getFullYear()+'-'+pad(d.getMonth()+1);render()}
else if(a==='tab'){tab=t.dataset.v;render()}
else if(a==='st'||a==='ed')openC(t.dataset.i);
else if(a==='new')openC(null);else if(a==='na')openA(null);else if(a==='ea')openA(+t.dataset.i);
else if(a==='chip'){sel=t.dataset.m;[].forEach.call(document.querySelectorAll('.chips button'),function(b){b.className=b.dataset.m===sel?'on':''})}
else if(a==='sync'){CFG.db=$('sdb').value.trim().replace(/\/+$/,'');PIN=$('spin').value.trim();try{localStorage.setItem('wifi_nj_db',CFG.db);localStorage.setItem('wifi_nj_pin',PIN)}catch(x){}got=false;SY='menghubungkan…';conn();render()}
else if(a==='hist')hist(t.dataset.i);else if(a==='acc')accSheet();
else if(a==='quick'){var qc=cust(edit);S.lm=S.lm||'t';S.pay[edit+'|'+cur]={m:S.lm,d:now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate()),a:qc.fee};save();closeS();render()}
else if(a==='exp')exp();
else if(a==='out'){try{localStorage.removeItem('wifi_nj_owner')}catch(x){}location.hash='';location.reload()}
else if(a==='cl')closeS();
else if(a==='cp'){var x=S.acc[t.dataset.i];copy(x.n.replace(/-/g,''),t)}
else if(a==='bill'){var l=S.cust.filter(function(c){return !paid(pay(c.id))});copy('*TAGIHAN WIFI NORTH JOENSTONE – '+ml(cur).toUpperCase()+'*\nBelum bayar:\n'+l.map(function(c,i){return (i+1)+'. '+c.name+' – '+rp(c.fee)}).join('\n')+'\n\nPaling lambat tgl 10.\nTransfer ke:\n'+accTxt(),t)}
else if(a==='sv'){var n=$('fn').value.trim().toUpperCase();if(!n)return;var f=+$('ff').value||S.fee,ph=$('fp').value.trim();
if(!edit){S.cust.push({id:'c'+Date.now(),name:n,fee:f,phone:ph,ip:$('fi').value.trim(),rnd:$('fr').checked})}else{var c=cust(edit);c.name=n;c.fee=f;c.phone=ph;c.ip=$('fi').value.trim();c.rnd=$('fr').checked;var k=edit+'|'+cur;if(sel!=='-'&&sel!=='g')S.lm=sel;if(sel==='-')delete S.pay[k];else S.pay[k]={m:sel,d:sel==='g'?'':$('fdt').value,a:sel==='g'?0:(+$('fa').value||f)}}
save();closeS();render()}
else if(a==='dc'){if(confirm('Hapus pelanggan ini beserta riwayatnya?')){S.cust=S.cust.filter(function(x){return x.id!==edit});Object.keys(S.pay).forEach(function(k){if(k.indexOf(edit+'|')===0)delete S.pay[k]});save();closeS();render()}}
else if(a==='sa'){var o={b:$('ab').value.trim(),n:$('an').value.trim(),o:$('ao').value.trim()};if(!o.b||!o.n)return;if(edit==null)S.acc.push(o);else S.acc[edit]=o;save();closeS();render()}
else if(a==='da'){S.acc.splice(edit,1);save();closeS();render()}
else if(a==='bk')copy(JSON.stringify(S),t);
else if(a==='rest'){try{var d=JSON.parse($('rs').value);if(!d.cust||!d.pay)throw 0;if(confirm('Ganti semua data dengan backup ini?')){S=d;save();render();t.textContent='Berhasil dipulihkan ✓'}}catch(x){t.textContent='Data tidak valid'}}});
document.addEventListener('change',function(e){if(e.target.id==='hide'){S.hide=e.target.checked;save()}if(e.target.id==='ipb'){S.ipBase=e.target.value.trim();save()}if(e.target.id==='fee'){S.fee=+e.target.value||60000;save()}});
cur=now.getFullYear()+'-'+pad(now.getMonth()+1);try{if(location.hash==='#edit')localStorage.setItem('wifi_nj_owner','1');EDIT=localStorage.getItem('wifi_nj_owner')==='1'}catch(e){}
cfgLoad();load();render();conn();
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
</script>
