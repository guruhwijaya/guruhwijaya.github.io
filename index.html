function openC(id){edit=id;var c=id?cust(id):{name:'',fee:S.fee,phone:''},p=id?pay(id):null;sel=p?p.m:'-';
var dv=p&&p.d?p.d:now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
var h='<h3>'+(id?esc(c.name):'Pelanggan baru')+'</h3><label>Nama</label><input id="fn" value="'+esc(c.name)+'" style="text-transform:uppercase"><label>No. WhatsApp</label><input id="fp" inputmode="tel" value="'+esc(c.phone)+'" placeholder="08xxxxxxxxxx"><label>Tarif per bulan (Rp)</label><input id="ff" type="number" inputmode="numeric" value="'+c.fee+'">';
if(id)h+='<label>Pembayaran '+ml(cur)+'</label><div class="chips">'+chips()+'</div><label>Tanggal bayar</label><input type="date" id="fdt" value="'+dv+'"><label>Nominal (Rp)</label><input type="number" id="fa" inputmode="numeric" value="'+(p&&p.a?p.a:c.fee)+'">';
h+='<div class="btns">'+(id?'<button class="del" data-a="dc">Hapus</button><a class="wa" target="_blank" rel="noopener" href="'+wa(c)+'">WhatsApp</a>':'')+'<button data-a="cl">Batal</button><button class="pri" data-a="sv">Simpan</button></div>';sheet(h)}
function openA(i){edit=i;var a=i==null?{b:'',n:'',o:''}:S.acc[i];sheet('<h3>'+(i==null?'Rekening baru':'Edit rekening')+'</h3><label>Bank / platform</label><input id="ab" value="'+esc(a.b)+'" placeholder="BCA, BRI, SeaBank, Shopee..."><label>Nomor</label><input id="an" value="'+esc(a.n)+'"><label>Atas nama (opsional)</label><input id="ao" value="'+esc(a.o)+'"><div class="btns">'+(i==null?'':'<button class="del" data-a="da">Hapus</button>')+'<button data-a="cl">Batal</button><button class="pri" data-a="sa">Simpan</button></div>')}
document.addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(!t){if(e.target.id==='ov')closeS();return}var a=t.dataset.a;if(!EDIT&&a!=='mv'&&a!=='tab'&&a!=='cp')return;
if(a==='mv'){var p=cur.split('-'),d=new Date(+p[0],+p[1]-1+ +t.dataset.n,1);cur=d.getFullYear()+'-'+pad(d.getMonth()+1);render()}
else if(a==='tab'){tab=t.dataset.v;render()}
else if(a==='st'||a==='ed')openC(t.dataset.i);
else if(a==='new')openC(null);else if(a==='na')openA(null);else if(a==='ea')openA(+t.dataset.i);
else if(a==='chip'){sel=t.dataset.m;[].forEach.call(document.querySelectorAll('.chips button'),function(b){b.className=b.dataset.m===sel?'on':''})}
else if(a==='exp')exp();
else if(a==='out'){try{localStorage.removeItem('wifi_nj_owner')}catch(x){}location.hash='';location.reload()}
else if(a==='cl')closeS();
else if(a==='cp'){var x=S.acc[t.dataset.i];copy(x.n.replace(/-/g,''),t)}
else if(a==='bill'){var l=S.cust.filter(function(c){return !paid(pay(c.id))});copy('*TAGIHAN WIFI NORTH JOENSTONE – '+ml(cur).toUpperCase()+'*\nBelum bayar:\n'+l.map(function(c,i){return (i+1)+'. '+c.name+' – '+rp(c.fee)}).join('\n')+'\n\nPaling lambat tgl 10.\nTransfer ke:\n'+accTxt(),t)}
else if(a==='sv'){var n=$('fn').value.trim().toUpperCase();if(!n)return;var f=+$('ff').value||S.fee,ph=$('fp').value.trim();
if(!edit){S.cust.push({id:'c'+Date.now(),name:n,fee:f,phone:ph})}else{var c=cust(edit);c.name=n;c.fee=f;c.phone=ph;var k=edit+'|'+cur;if(sel==='-')delete S.pay[k];else S.pay[k]={m:sel,d:sel==='g'?'':$('fdt').value,a:sel==='g'?0:(+$('fa').value||f)}}
save();closeS();render()}
else if(a==='dc'){if(confirm('Hapus pelanggan ini beserta riwayatnya?')){S.cust=S.cust.filter(function(x){return x.id!==edit});Object.keys(S.pay).forEach(function(k){if(k.indexOf(edit+'|')===0)delete S.pay[k]});save();closeS();render()}}
else if(a==='sa'){var o={b:$('ab').value.trim(),n:$('an').value.trim(),o:$('ao').value.trim()};if(!o.b||!o.n)return;if(edit==null)S.acc.push(o);else S.acc[edit]=o;save();closeS();render()}
else if(a==='da'){S.acc.splice(edit,1);save();closeS();render()}
else if(a==='bk')copy(JSON.stringify(S),t);
else if(a==='rest'){try{var d=JSON.parse($('rs').value);if(!d.cust||!d.pay)throw 0;if(confirm('Ganti semua data dengan backup ini?')){S=d;save();render();t.textContent='Berhasil dipulihkan ✓'}}catch(x){t.textContent='Data tidak valid'}}});
document.addEventListener('change',function(e){if(e.target.id==='fee'){S.fee=+e.target.value||60000;save()}});
cur=now.getFullYear()+'-'+pad(now.getMonth()+1);try{if(location.hash==='#edit')localStorage.setItem('wifi_nj_owner','1');EDIT=localStorage.getItem('wifi_nj_owner')==='1'}catch(e){}
load();render();
</script>
</body></html>
